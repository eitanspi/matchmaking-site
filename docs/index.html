<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>שידוכים</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- start screen: open / create a local data file -->
  <div id="start" class="gate">
    <div class="gate-card" style="max-width:440px">
      <div class="logo">💍</div>
      <h1>שידוכים</h1>
      <p>מאגר מועמדים והצעות שידוך — מקומי ופרטי, על המחשב שלך.</p>
      <div style="display:flex;flex-direction:column;gap:10px;margin-top:8px">
        <button id="btn-open" class="btn">📂 פתח מסד נתונים קיים</button>
        <button id="btn-new" class="btn ok">✨ צור מסד נתונים חדש</button>
        <button id="btn-resume" class="btn secondary hidden"></button>
        <button id="btn-demo" class="btn ghost">👀 טען נתוני דוגמה (לצפייה)</button>
        <input id="open-fallback" type="file" accept=".json" class="hidden">
      </div>
      <div id="start-note" class="subtle" style="margin-top:16px;font-size:.82rem"></div>
    </div>
  </div>

  <!-- app -->
  <div id="app" class="hidden">
    <nav class="nav">
      <div class="nav-inner">
        <span class="brand">💍 שידוכים</span>
        <button class="tab active" data-view="candidates">מועמדים</button>
        <button class="tab" data-view="matches">שידוכים</button>
        <button class="tab" data-view="ai">התאמות</button>
        <button class="tab" data-view="todo">אנשים להוסיף</button>
        <button class="tab" data-view="tasks">משימות</button>
        <span class="spacer"></span>
        <span id="save-status" class="subtle" style="color:#eef2ff;font-size:.82rem"></span>
        <button id="admin-toggle" class="tab">🔧 ניהול</button>
        <button id="close-btn" class="tab">✕ סגור</button>
      </div>
    </nav>
    <div class="container" id="main"></div>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>

  <script src="vendor/jszip.min.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
